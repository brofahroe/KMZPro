<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="48%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="plate" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="fiber" x1="128" y1="384" x2="400" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="94" fill="url(#plate)" />
  <rect x="20" y="20" width="472" height="472" rx="94" fill="url(#glow)" />
  <!-- Subtle grid lines -->
  <path d="M96 176 H416 M96 336 H416" stroke="#334155" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="8 10" />
  <!-- Pole vertical -->
  <line x1="168" y1="108" x2="168" y2="404" stroke="#f1f5f9" stroke-width="30" stroke-linecap="round" />
  <!-- Pole base foot -->
  <line x1="132" y1="404" x2="204" y2="404" stroke="#64748b" stroke-width="18" stroke-linecap="round" />
  <!-- Crossarm -->
  <line x1="108" y1="174" x2="228" y2="174" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" />
  <!-- Fiber cable route -->
  <path d="M168 174 L356 144 L264 274 L388 368" stroke="url(#fiber)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Nodes / Pole / FAT / JC -->
  <circle cx="168" cy="174" r="30" fill="#38bdf8" stroke="#0f172a" stroke-width="10" />
  <circle cx="356" cy="144" r="30" fill="#4ade80" stroke="#0f172a" stroke-width="10" />
  <circle cx="264" cy="274" r="27" fill="#facc15" stroke="#0f172a" stroke-width="10" />
  <circle cx="388" cy="368" r="34" fill="#38bdf8" stroke="#0f172a" stroke-width="10" />
</svg>
